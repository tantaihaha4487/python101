  <desc id="desc">A Python-themed blue and yellow learning icon.</desc>
  <defs>
    <linearGradient id="blue" x1="20" x2="108" y1="16" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3776ab"/>
      <stop offset="1" stop-color="#1f4f7a"/>
    </linearGradient>
    <linearGradient id="yellow" x1="20" x2="108" y1="112" y2="16" gradientUnits="userSpaceOnUse">
